<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arakutrails.com - Welcome to Araku Trails</title>
  <meta name="description" content="Explore the breathtaking hills and valleys of Araku with Araku Trails.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b130e;
      --bg-surface: rgba(18, 30, 23, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-green: #34d399;
      --accent-glow: rgba(52, 211, 153, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --gradient-brand: linear-gradient(135deg, #34d399 0%, #10b981 50%, #059669 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 2rem 1.25rem;
    }

    /* Ambient background lighting */
    .bg-lights {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .light-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: float 14s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #059669, transparent);
      top: -100px;
      right: -100px;
    }

    .blob-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #10b981, transparent);
      bottom: -80px;
      left: -80px;
      animation-delay: -7s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(40px, 30px) scale(1.08);
      }
    }

    /* Container Card */
    .card-container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7),
        0 0 35px -5px var(--accent-glow);
      padding: 3rem 2.5rem;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-container:hover {
      transform: translateY(-2px);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8),
        0 0 45px -5px rgba(52, 211, 153, 0.35);
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--accent-green);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* README content styling */
    .readme-header {
      font-size: clamp(2.25rem, 5vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }

    .readme-welcome {
      font-size: 1.35rem;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .readme-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      margin: 2rem 0;
    }

    /* Source file badge & footer */
    .source-meta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .source-meta code {
      color: var(--accent-green);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>

<body>
  <div class="bg-lights">
    <div class="light-blob blob-1"></div>
    <div class="light-blob blob-2"></div>
  </div>

  <main class="card-container" id="readme-viewer">
    <div class="badge">
      <span class="badge-dot"></span>
      README Viewer
    </div>

    <!-- Content rendered from README.md -->
    <h1 class="readme-header" id="title">arakutrails.com</h1>
    <p class="readme-welcome" id="welcome-message">Hello and Welcome to Araku Trails</p>
    <p class="readme-subtitle" id="tagline">Explore the Araku with us</p>

    <div class="divider"></div>

    <div class="source-meta">
      Rendered directly from <code>README.md</code>
    </div>
  </main>
</body>

</html>
